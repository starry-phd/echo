name: Echo isolated Starry ID/Battery staging preview
on:
  pull_request:
    paths:
      - 'worker/echoPreview.ts'
      - 'wrangler.echo-preview.toml'
      - 'src/auth/starryId/**'
      - 'openapi/starry-id.v1.json'
      - 'packages/starry-id-sdk/**'
      - 'scripts/run-isolated-openapi-generator.mjs'
      - '.github/workflows/echo-staging-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-api-staging
  cancel-in-progress: false

jobs:
  staging-preview:
    # No untrusted fork pull requests may use Cloudflare secrets.
    if: github.repository == 'starry-phd/echo' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and OpenAPI-generated Starry ID types
        run: npm install --no-audit --no-fund
      - name: Validate types, lint and relevant tests
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build the actual Echo Expo Web app for isolated preview
        env:
          EXPO_PUBLIC_ECHO_API_BASE_URL: https://echo-api-staging.starry-phd.workers.dev
          EXPO_PUBLIC_STARRY_ID_API_BASE_URL: https://id.starry.phd
        run: |
          npm run build:web
          node scripts/check-inline-scripts.mjs dist
          test -s dist/index.html
          test -s dist/_headers
      - name: Ensure Cloudflare account already exists and deploy only staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN missing for this PR staging workflow; configure an existing-account scoped secret, never publish it";exit 1
          fi
          # Account is already configured in the existing project. Never print
          # its value or commit a duplicate account ID in this preview change.
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            CLOUDFLARE_ACCOUNT_ID="$(node -e "const t=require('fs').readFileSync('wrangler.toml','utf8');const m=t.match(/^account_id\\s*=\\s*\\\"([a-f0-9]{32})\\\"/m);if(!m)process.exit(1);process.stdout.write(m[1])")"
            export CLOUDFLARE_ACCOUNT_ID
          fi
          test "$(node -p "require('fs').readFileSync('wrangler.echo-preview.toml','utf8').includes('name = \"echo-api-staging\"')")" = "true"
          npx --yes wrangler@4 deploy --config wrangler.echo-preview.toml
      - name: Verify exact staging preview and upstream Echo app registration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors --max-time 15 https://echo-api-staging.starry-phd.workers.dev/api/status -o /tmp/echo-preview-status.json
          node - <<'NODE'
          const r=require('/tmp/echo-preview-status.json');
          console.log('Echo registration:',r.app_status,'Starry ID health:',r.id_health,'upstream HTTP:',r.upstream_http,'errors:',r.upstream_errors);
          if(r.environment!=='echo-api-staging'||r.app_id!=='echo'||r.app_status!=='active'||!r.id_health||r.can_login_from_preview!==true||r.callback_registered!=='https://echo-api-staging.starry-phd.workers.dev')process.exit(1);
          NODE

      - name: Verify Starry ID published Echo Passkey links (GET only, no login or keys)
        shell: bash
        run: |
          set -euo pipefail
          base='https://id.starry.phd/.well-known'
          curl -fsS --retry 4 --retry-delay 2 --max-time 20 "$base/assetlinks.json" -o /tmp/echo-passkey-assetlinks.json
          curl -fsS --retry 4 --retry-delay 2 --max-time 20 "$base/apple-app-site-association" -o /tmp/echo-passkey-apple-aasa.json
          curl -fsS --retry 4 --retry-delay 2 --max-time 20 "$base/webauthn" -o /tmp/echo-passkey-web-origins.json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const parse = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = '04:10:CC:35:A5:79:A9:CF:EF:4E:33:1C:F1:06:AE:70:64:00:6B:11:01:4A:FA:FB:B4:FB:51:36:A6:AD:AC:6C';
          const assetlinks = parse('/tmp/echo-passkey-assetlinks.json');
          assert.ok(Array.isArray(assetlinks), 'assetlinks is not a JSON array');
          const matches = assetlinks.filter(link => link?.target?.namespace === 'android_app' &&
            link.target.package_name === 'phd.starry.echo' &&
            link.relation?.includes('delegate_permission/common.get_login_creds'));
          assert.equal(matches.length, 1, 'Echo must have exactly one Android get_login_creds association');
          assert.ok(matches[0].target.sha256_cert_fingerprints?.includes(expected),
            'Echo EAS APK signing certificate has not appeared in the public assetlinks.json');
          const apple = parse('/tmp/echo-passkey-apple-aasa.json');
          assert.ok(apple.webcredentials?.apps?.includes('4W7QRTXN5Y.phd.starry.echo'),
            'Echo iOS app not published in Starry ID AASA');
          const web = parse('/tmp/echo-passkey-web-origins.json');
          for (const origin of ['https://echo.starry.phd','https://echo-api-staging.starry-phd.workers.dev'])
            assert.ok(web.origins?.includes(origin), 'Echo web Passkey origin not published: '+origin);
          console.log('Echo signed Android APK, iOS association and two WebAuthn origins are publicly registered.');
          NODE
      - name: GET Echo app registration from Starry ID (public, read only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 20 \
            'https://id.starry.phd/v1/apps/echo/config' -o /tmp/echo-starry-app-config.json
          node - <<'NODE'
          const r=require('/tmp/echo-starry-app-config.json');
          if(r.app_id!=='echo'||r.status!=='active'||typeof r.min_version!=='string')process.exit(1);
          console.log('Central GET /v1/apps/echo/config verified:',r.app_id,r.status,'min_version',r.min_version);
          NODE
      - name: Smoke test real Echo UI, approved guest cards, and no private audio
        shell: bash
        run: |
          set -euo pipefail
          base=https://echo-api-staging.starry-phd.workers.dev
          curl -fsS --retry 3 --max-time 15 "$base/" -o /tmp/echo-preview-ui.html
          grep -qi '<html' /tmp/echo-preview-ui.html
          if grep -q 'Echo｜串接驗證' /tmp/echo-preview-ui.html; then
            echo "::error::Homepage still shows diagnostics, not the real Echo Web app";exit 1
          fi
          curl -fsS --max-time 15 "$base/integration" -o /tmp/echo-preview-integration.html
          grep -q '串接驗證' /tmp/echo-preview-integration.html
          curl -fsS --max-time 15 "$base/api/v1/previews" -o /tmp/echo-preview-cards.json
          node - <<'NODE'
          const r=require('/tmp/echo-preview-cards.json');
          if(!Array.isArray(r.tracks)||r.tracks.length<1)process.exit(1);
          console.log('Live approved Echo preview cards:',r.tracks.length);
          NODE
          private_status="$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/v1/tracks/not-verified-and-public/stream")"
          test "$private_status" = '404'
      - name: Verify Starry ID browser CORS and Google relay accepts exact preview URL
        shell: bash
        run: |
          set -euo pipefail
          origin='https://echo-api-staging.starry-phd.workers.dev'
          config='https://id.starry.phd/v1/apps/echo/config'
          code="$(curl -sS --max-time 20 -D /tmp/echo-starry-cors.headers -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H "Origin: $origin" -H 'Access-Control-Request-Method: GET' "$config")"
          test "$code" = 204
          tr -d '\r' < /tmp/echo-starry-cors.headers | grep -Fxi "access-control-allow-origin: $origin"
          nonce_hash="$(printf '%064d' 0)"
          relay="$(node -e "const u=new URL('https://id.starry.phd/auth/google/start');u.searchParams.set('app_id','echo');u.searchParams.set('nonce',process.argv[1]);u.searchParams.set('return','https://echo-api-staging.starry-phd.workers.dev/auth/done');u.searchParams.set('state','echo-preview-registry-probe-20261107');process.stdout.write(u.toString())" "$nonce_hash")"
          status="$(curl -sS --max-time 20 -D /tmp/echo-starry-relay.headers -o /dev/null -w '%{http_code}' "$relay")"
          test "$status" = 302
          tr -d '\r' < /tmp/echo-starry-relay.headers | grep -Ei '^location: https://accounts.google.com/o/oauth2/v2/auth[?]'
      - name: Verify nonce POST preflight and fail-closed Battery preview
        shell: bash
        run: |
          set -euo pipefail
          origin='https://echo-api-staging.starry-phd.workers.dev'
          nonce_url='https://id.starry.phd/v1/auth/nonce'
          # OPTIONS is read-only: verifies the browser can request a nonce,
          # but does not create login sessions or touch member records.
          status="$(curl -sS --max-time 20 -D /tmp/echo-nonce-preflight.headers -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' "$nonce_url")"
          test "$status" = '204'
          tr -d '\r' < /tmp/echo-nonce-preflight.headers | grep -Fxi "access-control-allow-origin: $origin"
          tr -d '\r' < /tmp/echo-nonce-preflight.headers | grep -Ei '^access-control-allow-methods:.*POST'
          tr -d '\r' < /tmp/echo-nonce-preflight.headers | grep -Ei '^access-control-allow-headers:.*content-type'
          base='https://echo-api-staging.starry-phd.workers.dev'
          balance_status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$base/api/battery/balance")"
          smoke_status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "$base/api/battery/smoke")"
          price_status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$base/api/v1/battery/task-settings")"
          test "$balance_status" = '401'
          test "$smoke_status" = '401'
          # This isolated staging Worker deliberately has no Echo D1 binding:
          # owner task-price writes are blocked until a separately approved staging DB exists.
          test "$price_status" = '404'
          echo 'Login nonce CORS preflight and unauthenticated Battery/Owner protections passed.'
