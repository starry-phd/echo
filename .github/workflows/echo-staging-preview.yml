name: Echo isolated Starry ID/Battery staging preview
on:
  pull_request:
    paths:
      - 'worker/echoPreview.ts'
      - 'wrangler.echo-preview.toml'
      - 'src/auth/starryId/**'
      - 'openapi/starry-id.v1.json'
      - 'packages/starry-id-sdk/**'
      - 'scripts/run-isolated-openapi-generator.mjs'
      - '.github/workflows/echo-staging-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-api-staging
  cancel-in-progress: false

jobs:
  staging-preview:
    # No untrusted fork pull requests may use Cloudflare secrets.
    if: github.repository == 'starry-phd/echo' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and OpenAPI-generated Starry ID types
        run: npm install --no-audit --no-fund
      - name: Validate types, lint and relevant tests
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build the actual Echo Expo Web app for isolated preview
        env:
          EXPO_PUBLIC_ECHO_API_BASE_URL: https://echo-api-staging.starry-phd.workers.dev
          EXPO_PUBLIC_STARRY_ID_API_BASE_URL: https://id.starry.phd
        run: |
          npm run build:web
          node scripts/check-inline-scripts.mjs dist
          test -s dist/index.html
          test -s dist/_headers
      - name: Ensure Cloudflare account already exists and deploy only staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN missing for this PR staging workflow; configure an existing-account scoped secret, never publish it";exit 1
          fi
          # Account is already configured in the existing project. Never print
          # its value or commit a duplicate account ID in this preview change.
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            CLOUDFLARE_ACCOUNT_ID="$(node -e "const t=require('fs').readFileSync('wrangler.toml','utf8');const m=t.match(/^account_id\\s*=\\s*\\\"([a-f0-9]{32})\\\"/m);if(!m)process.exit(1);process.stdout.write(m[1])")"
            export CLOUDFLARE_ACCOUNT_ID
          fi
          test "$(node -p "require('fs').readFileSync('wrangler.echo-preview.toml','utf8').includes('name = \"echo-api-staging\"')")" = "true"
          npx --yes wrangler@4 deploy --config wrangler.echo-preview.toml
      - name: Verify exact staging preview and upstream Echo app registration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors --max-time 15 https://echo-api-staging.starry-phd.workers.dev/api/status -o /tmp/echo-preview-status.json
          node - <<'NODE'
          const r=require('/tmp/echo-preview-status.json');
          console.log('Echo registration:',r.app_status,'Starry ID health:',r.id_health,'upstream HTTP:',r.upstream_http,'errors:',r.upstream_errors);
          if(r.environment!=='echo-api-staging'||r.app_id!=='echo'||r.app_status!=='active'||!r.id_health||r.can_login_from_preview!==true||r.callback_registered!=='https://echo-api-staging.starry-phd.workers.dev')process.exit(1);
          NODE
      - name: Smoke test real Echo UI, approved guest cards, and no private audio
        shell: bash
        run: |
          set -euo pipefail
          base=https://echo-api-staging.starry-phd.workers.dev
          curl -fsS --retry 3 --max-time 15 "$base/" -o /tmp/echo-preview-ui.html
          grep -qi '<html' /tmp/echo-preview-ui.html
          if grep -q 'Echo｜串接驗證' /tmp/echo-preview-ui.html; then
            echo "::error::Homepage still shows diagnostics, not the real Echo Web app";exit 1
          fi
          curl -fsS --max-time 15 "$base/integration" -o /tmp/echo-preview-integration.html
          grep -q '串接驗證' /tmp/echo-preview-integration.html
          curl -fsS --max-time 15 "$base/api/v1/previews" -o /tmp/echo-preview-cards.json
          node - <<'NODE'
          const r=require('/tmp/echo-preview-cards.json');
          if(!Array.isArray(r.tracks)||r.tracks.length<1)process.exit(1);
          console.log('Live approved Echo preview cards:',r.tracks.length);
          NODE
          private_status="$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/v1/tracks/not-verified-and-public/stream")"
          test "$private_status" = '404'
      - name: Verify Starry ID browser CORS and Google relay accepts exact preview URL
        shell: bash
        run: |
          set -euo pipefail
          origin='https://echo-api-staging.starry-phd.workers.dev'
          config='https://id.starry.phd/v1/apps/echo/config'
          code="$(curl -sS --max-time 20 -D /tmp/echo-starry-cors.headers -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H "Origin: $origin" -H 'Access-Control-Request-Method: GET' "$config")"
          test "$code" = 204
          tr -d '\r' < /tmp/echo-starry-cors.headers | grep -Fxi "access-control-allow-origin: $origin"
          nonce_hash="$(printf '%064d' 0)"
          relay="$(node -e "const u=new URL('https://id.starry.phd/auth/google/start');u.searchParams.set('app_id','echo');u.searchParams.set('nonce',process.argv[1]);u.searchParams.set('return','https://echo-api-staging.starry-phd.workers.dev/auth/done');u.searchParams.set('state','echo-preview-registry-probe-20261107');process.stdout.write(u.toString())" "$nonce_hash")"
          status="$(curl -sS --max-time 20 -D /tmp/echo-starry-relay.headers -o /dev/null -w '%{http_code}' "$relay")"
          test "$status" = 302
          tr -d '\r' < /tmp/echo-starry-relay.headers | grep -Ei '^location: https://accounts.google.com/o/oauth2/v2/auth[?]'
