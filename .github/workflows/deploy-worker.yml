name: Deploy Expo Web to Cloudflare Workers Static Assets

# Production deployment is intentionally manual until central ID/media acceptance.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-starry-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9ff1b4c261141730ac2fe0683f730062
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repo Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run api:check
      - run: npm test
      - run: npm run build:web
      - name: Deploy website and API together
        run: npx --yes wrangler@4 deploy
