name: Echo App checks
on:
  push:
    branches: [main]
  pull_request:
# Avoid multiple full CI builds for superseded PR commits.
concurrency:
  group: echo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned open-source Gitleaks CLI (no license)
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          root="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL "${root}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl -fsSL "${root}/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          (cd /tmp && grep "gitleaks_${version}_linux_x64.tar.gz" gitleaks-checksums.txt | sha256sum -c -)
          mkdir -p /tmp/echo-gitleaks
          tar -xf /tmp/gitleaks.tar.gz -C /tmp/echo-gitleaks gitleaks
          /tmp/echo-gitleaks/gitleaks version
      - name: Reject secrets including Starry Battery sbk_ service keys
        run: /tmp/echo-gitleaks/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Expo 58 native dependency compatibility
        run: npm run expo:doctor
      - run: npm run api:check
      - run: npm run monetization:check
      - run: npm run release:guard
      - name: Quarantined legacy D1 staging preflight (offline only)
        run: npm run staging:check
      - run: npm run ui:check
      - run: npm test
      # Static Expo/Hermes JS bundle checks only. Never run EAS signing,
      # Apple/Google submission or private audio audits in this CI.
      # Each native bundle embeds the approved public workers.dev URL; Web keeps its own origin.
      - name: Verify iOS Hermes bundle export (no signing)
        env:
          EXPO_PUBLIC_ECHO_API_BASE_URL: https://echo.starry.phd
        run: |
          npx expo export --platform ios --output-dir /tmp/echo-native-ios
          test -n "$(find /tmp/echo-native-ios -type f -print -quit)"
      - name: Verify Android Hermes bundle export (no signing)
        env:
          EXPO_PUBLIC_ECHO_API_BASE_URL: https://echo.starry.phd
        run: |
          npx expo export --platform android --output-dir /tmp/echo-native-android
          test -n "$(find /tmp/echo-native-android -type f -print -quit)"
      - run: npm run build:web
      - name: Verify Web security headers file is shipped with the static assets
        run: cmp public/_headers dist/_headers
      - name: Every inline script in the exported pages is allowed by an exact CSP hash
        run: node scripts/check-inline-scripts.mjs dist
      - name: Verify Wrangler bundle and Workers Static Assets without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: echo-starry-web-dist
          path: dist/
          if-no-files-found: error
