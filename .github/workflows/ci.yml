name: Echo App checks
on:
  push:
    branches: [main]
  pull_request:
# Avoid multiple full CI builds for superseded PR commits.
concurrency:
  group: echo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Expo 58 native dependency compatibility
        run: npm run expo:doctor
      - run: npm run api:check
      - run: npm run monetization:check
      - run: npm run release:guard
      - run: npm run ui:check
      - run: npm test
      - run: npm run build:web
      - name: Diagnose currently live public guest endpoints (aggregates only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/diagnose-public-guest.mjs
      - name: Verify Wrangler bundle and Workers Static Assets without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: echo-starry-web-dist
          path: dist/
          if-no-files-found: error
