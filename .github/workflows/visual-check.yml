name: Production visual check (read-only screenshots)
# After each successful Production deploy, open the public site in real Chromium,
# take screenshots and report page errors / third-party requests. Read-only:
# GET page loads only, no secrets, no write permissions, never deploys anything.
on:
  workflow_run:
    workflows: [Deploy Echo public Web shell to Cloudflare Workers]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: echo-visual-check
  cancel-in-progress: true
jobs:
  screenshots:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium in an isolated folder (not the app dependencies)
        run: |
          set -euo pipefail
          mkdir -p /tmp/echo-visual
          cp scripts/visual-check-production.mjs scripts/a11y-audit-production.mjs scripts/a11y-summary.mjs /tmp/echo-visual/
          cd /tmp/echo-visual
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Screenshot the live public site (read-only)
        working-directory: /tmp/echo-visual
        env:
          ECHO_VISUAL_OUT: /tmp/echo-visual/shots
        run: node visual-check-production.mjs
      - name: Accessibility audit with axe-core (WCAG 2.1 A/AA, read-only)
        if: always()
        working-directory: /tmp/echo-visual
        env:
          ECHO_A11Y_REPORT: /tmp/echo-visual/shots/a11y-report.json
          ECHO_A11Y_FAIL_ON: none
        run: node a11y-audit-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echo-starry-production-screenshots
          path: /tmp/echo-visual/shots/
          retention-days: 14
