name = "echo-starry"
main = "worker/index.ts"
account_id = "9ff1b4c261141730ac2fe0683f730062"
compatibility_date = "2026-10-27"
# User-approved canonical production domain; workers.dev is technical/fallback only.
# Cloudflare custom domain is already bound to this exact Worker (not temp bridge).
workers_dev = true

[[routes]]
pattern = "echo.starry.phd"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "echo-starry"
database_id = "8437c865-d7f5-4efb-8c95-44ee3d3fdb21"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "echo-starry"

# Expo Web SPA + backend API served by the SAME Cloudflare Worker.
# No Cloudflare Pages project is used.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]
